name: Bug report
description: Something is wrong in the spec, docs, or tooling
title: "bug(<scope>): "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more precise you are,
        the faster it gets fixed. No bug is too small.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
      placeholder: "When I run `tools/check-docs-frontmatter.sh`, it fails on docs/spec/intent.md even though the frontmatter looks right."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Affected area
      description: Which part of the repo?
      placeholder: "docs, tools, CI, protocol, skills"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps, commands, or a minimal example.
      placeholder: "1. Clone at commit abc1234\n2. Run `npm run check`\n3. See error"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, screenshots, related issues, environment details.
  - type: checkboxes
    id: terms
    attributes:
      label: Contributor terms
      options:
        - label: I have read CONTRIBUTING.md and CODE_OF_CONDUCT.md
          required: true
