name: Feature request
description: Propose something new for Chorus
title: "feat(<scope>): "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome — especially ones that make the platform more
        reciprocal, more portable, or easier to contribute to.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or painful today?
      placeholder: "There is no way for a video's subject to respond with equal prominence on PeerTube today."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Which Chorus principle does this serve?
      options:
        - "Separation of speech/hosting/amplification"
        - "Portable identity"
        - "First-class reciprocity"
        - "Pluggable algorithms"
        - "Deamplify, don't erase"
        - "Transparency"
        - "Contribution friendliness"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else have you considered?
  - type: checkboxes
    id: terms
    attributes:
      label: Contributor terms
      options:
        - label: I have read CONTRIBUTING.md and CODE_OF_CONDUCT.md
          required: true
